<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UTPasar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:wght@400;600&display=swap">
<style>
:root{--page:#cbbcff;--card:#fff;--ink:#1c1535;--mute:#5b5478;--line:#e1daf5;--input:#f4f1ff;--chip:#ebe5ff;--btn:#1c1535;--btnInk:#fff;--yel:#f7e04b;--warn:#fff1c7;--warnInk:#5c4200;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#231c3f;--card:#2e2552;--ink:#f2eeff;--mute:#b9b0dc;--line:#433870;--input:#261f47;--chip:#3a3063;--btn:#f7e04b;--btnInk:#1c1535;--warn:#3a2f0c;--warnInk:#f3d98a;color-scheme:dark}}
:root[data-theme="dark"]{--page:#231c3f;--card:#2e2552;--ink:#f2eeff;--mute:#b9b0dc;--line:#433870;--input:#261f47;--chip:#3a3063;--btn:#f7e04b;--btnInk:#1c1535;--warn:#3a2f0c;--warnInk:#f3d98a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;--sky:#f6a9d4;--blob:#e8572a}
body[data-tab="post"],body[data-tab="signup"]{--sky:#f4e04d;--blob:#2b9a5c}
body[data-tab="about"],body[data-tab="mine"]{--sky:#ffd1a8;--blob:#4a5be0}
.phone{max-width:430px;margin:0 auto;background:var(--card);overflow:hidden}
@media (min-width:600px){.phone{margin:24px auto;border:10px solid #1b1630;border-radius:46px;box-shadow:0 24px 60px rgba(28,21,53,.35)}}
.hero{position:relative;background:var(--blob);color:#fff;padding:0 18px 20px;text-align:center}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:170px;background:var(--sky)}
.hero>*{position:relative}
.awning{margin:0 -18px}
.awning svg{display:block;width:100%;height:34px}
.top{display:flex;justify-content:space-between;align-items:center;padding-top:8px}
.brand{font-family:Anton,Impact,sans-serif;font-size:1.4rem;color:#1c1535;letter-spacing:.01em}
.tag{display:inline-block;background:var(--yel);color:#1c1535;border-radius:99px;padding:3px 11px;font-size:.8rem;font-weight:600}
.blob{display:block;width:76%;max-width:300px;margin:4px auto -2px}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(2.4rem,11vw,3.2rem);line-height:1.02;text-transform:uppercase;margin:4px 0 6px}
.date{font-weight:600;margin:0 0 14px}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:inherit}
nav button{font-weight:600;border:0;border-radius:14px;padding:10px 16px;background:rgba(255,255,255,.25);color:#fff;cursor:pointer}
nav button[aria-selected="true"]{background:var(--yel);color:#1c1535}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blob);outline-offset:2px}
.content{padding:18px 16px 40px;background:var(--card)}
.panel{background:var(--input);border-radius:22px;padding:16px;margin-bottom:14px}
h2{font-size:1.15rem;margin:0 0 10px;font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pill{border:0;border-radius:14px;padding:9px 14px;background:var(--chip);color:var(--ink);font-weight:600;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--yel);color:#1c1535}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
.full{grid-column:1/-1}
label{display:block;font-size:.9rem;font-weight:600;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:9px 12px}
textarea{min-height:70px;resize:vertical}
.btn{background:var(--btn);color:var(--btnInk);border:0;border-radius:14px;padding:12px 20px;font-weight:600;cursor:pointer;margin:12px 8px 0 0}
.btn.alt{background:var(--yel);color:#1c1535}
.item{display:flex;gap:12px;padding:14px 0;border-top:2px dashed var(--line)}
.item:first-child{border-top:0}
.pic{flex:0 0 54px;height:54px;border-radius:50%;background:var(--blob);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Anton,Impact,sans-serif;font-size:1.5rem}
.info{flex:1;min-width:0}
.name{font-weight:600}
.meta{color:var(--mute);font-size:.88rem}
.chips span{display:inline-block;background:var(--chip);border-radius:99px;padding:1px 10px;font-size:.8rem;margin:4px 6px 0 0}
.score{text-align:right;flex:0 0 76px}
.score b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:1.9rem;line-height:1}
.bar{height:8px;background:var(--line);border-radius:4px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blob)}
.why{font-size:.8rem;color:var(--mute);margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:10px 6px;border-top:2px dashed var(--line);vertical-align:top}
th{font-weight:600}
.note{font-size:.84rem;color:var(--mute);margin-top:10px}
.msg{background:var(--warn);color:var(--warnInk);border-radius:14px;padding:10px 12px;margin-top:12px;font-size:.92rem}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;margin-top:10px}
.card{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit;width:100%}
.ph{position:relative;aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:var(--chip)}
.ph svg,.ph img,.dp svg,.dp img{display:block;width:100%;height:100%;object-fit:cover}
.ago{position:absolute;left:8px;top:8px;background:rgba(28,21,53,.7);color:#fff;border-radius:99px;padding:1px 9px;font-size:.78rem}
.best{position:absolute;left:8px;bottom:8px;background:var(--yel);color:#1c1535;border-radius:99px;padding:1px 9px;font-size:.78rem;font-weight:600}
.cn{font-weight:600;margin-top:8px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cp{font-weight:600;font-size:1.05rem}
.cs{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:.88rem}
.av{width:20px;height:20px;border-radius:50%;background:var(--blob);color:#fff;font-size:.7rem;display:inline-flex;align-items:center;justify-content:center;font-weight:600}
.rh{display:flex;justify-content:space-between;align-items:center;gap:8px}
dialog{border:0;border-radius:26px;padding:0;width:min(92vw,400px);max-height:90vh;background:var(--card);color:var(--ink);overflow:auto}
dialog::backdrop{background:rgba(28,21,53,.6)}
.dp{position:relative;aspect-ratio:1/1}
.db{padding:16px}
.dx{position:absolute;right:10px;top:10px;border:0;border-radius:50%;width:38px;height:38px;background:var(--card);color:var(--ink);font-size:1.3rem;cursor:pointer}
.det{margin:10px 0;padding:0;list-style:none}
.det li{padding:7px 0;border-top:2px dashed var(--line);display:flex;justify-content:space-between;gap:12px}
.det span{color:var(--mute)}
.mt{background:var(--input);border-radius:16px;padding:12px;margin:12px 0}
.mt b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:1.6rem}
[hidden]{display:none!important}
button.tag{border:0;cursor:pointer;font:inherit;font-weight:600;font-size:.8rem}
.sold img,.sold svg{filter:grayscale(1);opacity:.5}
.soldtag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);background:#1c1535;color:#fff;font-family:Anton,Impact,sans-serif;letter-spacing:.06em;font-size:1.3rem;padding:2px 16px;border-radius:10px;border:2px solid #fff}
.gone{text-decoration:line-through;color:var(--mute)}
.btn:disabled{opacity:.5;cursor:default}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.eye{animation:none}}
</style>
</head>
<body data-tab="login">
<div class="phone">
<header class="hero">
<div class="awning" aria-hidden="true"><svg viewBox="0 0 560 34" preserveAspectRatio="none"><defs><pattern id="sc" width="56" height="34" patternUnits="userSpaceOnUse"><rect width="28" height="20" fill="#e8452c"/><circle cx="14" cy="20" r="14" fill="#e8452c"/><rect x="28" width="28" height="20" fill="#fff4dc"/><circle cx="42" cy="20" r="14" fill="#fff4dc"/></pattern></defs><rect width="560" height="34" fill="url(#sc)"/></svg></div>
<div class="top"><span class="brand">UTPasar</span><button class="tag" id="out" hidden>Log out</button></div>
<svg class="blob" viewBox="0 -14 300 224" role="img" aria-label="Friendly market vendor character"><path d="M10 210C10 70 80 20 150 20S290 70 290 210Z" style="fill:var(--blob)"/><path d="M150 22Q148 10 146 2" fill="none" stroke="#2b7a4b" stroke-width="4" stroke-linecap="round"/><ellipse cx="136" cy="2" rx="11" ry="5.5" transform="rotate(-22 136 2)" fill="#3fae6b"/><ellipse cx="158" cy="5" rx="11" ry="5.5" transform="rotate(22 158 5)" fill="#3fae6b"/><ellipse cx="72" cy="178" rx="14" ry="9" fill="#ff8fb1" opacity=".85"/><ellipse cx="228" cy="178" rx="14" ry="9" fill="#ff8fb1" opacity=".85"/><g id="eyes"><g class="eye"><ellipse cx="112" cy="146" rx="27" ry="31" fill="#fff"/><g id="p1"><circle cx="112" cy="150" r="15" fill="#1c1535"/><circle cx="118" cy="144" r="4.5" fill="#fff"/></g></g><g class="eye"><ellipse cx="188" cy="146" rx="27" ry="31" fill="#fff"/><g id="p2"><circle cx="188" cy="150" r="15" fill="#1c1535"/><circle cx="194" cy="144" r="4.5" fill="#fff"/></g></g></g><g id="joy" style="display:none" fill="none" stroke="#1c1535" stroke-width="9" stroke-linecap="round"><path d="M86 154Q112 118 138 154"/><path d="M162 154Q188 118 214 154"/></g><path id="mo" d="M120 184Q150 218 180 184Z" fill="#1c1535"/></svg>
<h1 id="ht">Welcome back</h1>
<p class="date" id="dt"></p>
<nav id="navAuth" role="tablist" aria-label="Account">
<button role="tab" aria-selected="true" data-tab="login">Log in</button>
<button role="tab" aria-selected="false" data-tab="signup">Sign up</button>
</nav>
<nav id="navApp" role="tablist" aria-label="Sections" hidden>
<button role="tab" aria-selected="true" data-tab="find">Find items</button>
<button role="tab" aria-selected="false" data-tab="post">Post an item</button>
<button role="tab" aria-selected="false" data-tab="mine">My listings</button>
</nav>
</header>
<main class="content">
<section id="login">
<div class="panel"><h2>Log in</h2>
<div class="grid">
<div class="full"><label for="lu">Username</label><input id="lu" autocomplete="username"></div>
<div class="full"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password"></div>
</div>
<button class="btn" id="lg">Log in</button>
<div class="msg" id="lm" hidden></div>
</div>
</section>
<section id="signup" hidden>
<div class="panel"><h2>Create your account</h2>
<p class="meta">For UTP students only. We use your student ID to verify your account.</p>
<div class="grid">
<div class="full"><label for="si">Student ID</label><input id="si" inputmode="numeric" placeholder="numbers only"></div>
<div class="full"><label for="su">Username</label><input id="su" placeholder="shown on your listings" autocomplete="off"></div>
<div class="full"><label for="sp">Password</label><input id="sp" type="password" autocomplete="new-password"></div>
<div class="full"><label for="scard">Photo of your student card</label><input id="scard" type="file" accept="image/*"></div>
</div>
<button class="btn" id="sb">Sign up</button>
<div class="msg" id="sm" hidden></div>
</div>
</section>
<section id="find" hidden>
<div class="panel">
<h2>Pick a category</h2>
<div class="pills" id="cc"></div><select id="fc" hidden></select>
<div class="grid">
<div class="full"><label for="q">Describe the item</label><input id="q" placeholder="for example: small fan for my room"></div>
<div><label for="fb">Maximum budget (RM)</label><input id="fb" type="number" min="0" placeholder="leave empty for any"></div>
<div><label for="fk">Condition</label><select id="fk"><option>Any</option><option>New</option><option>Good</option><option>Used</option></select></div>
<div class="full"><label for="fv">Your village</label><select id="fv"></select></div>
</div>
<button class="btn" id="go">Find matches</button>
</div>
<div class="panel"><div class="rh"><h2 id="rt">Listings on UTPasar</h2><button class="pill" id="all" hidden>Show all</button></div><div class="cards" id="res"></div></div>
</section>
<section id="post" hidden>
<div class="panel">
<h2>List an item</h2>
<div class="grid">
<div class="full"><label for="pn">Item name</label><input id="pn" placeholder="for example: rice cooker"></div>
<div class="full"><label for="pd">Description</label><textarea id="pd" placeholder="Condition, size, anything the buyer should know"></textarea></div>
<div class="full"><label for="pf">Photo (optional)</label><input id="pf" type="file" accept="image/*"></div>
<div><label for="pc">Category</label><select id="pc"></select></div>
<div><label for="pp">Price (RM, 0 for free)</label><input id="pp" type="number" min="0" value="0"></div>
<div><label for="pk">Condition</label><select id="pk"><option>New</option><option selected>Good</option><option>Used</option></select></div>
<div><label for="pv">Your village</label><select id="pv"></select></div>
</div>
<button class="btn alt" id="sug">Get suggestions</button><button class="btn" id="add">Add listing</button>
<div class="msg" id="pm" hidden></div>

</div>
</section>
<section id="mine" hidden>
<div class="panel"><h2>Your listings</h2><div class="cards" id="mc"></div></div>
</section>
</main>
</div>

<dialog id="dlg" aria-label="Item details"></dialog>

var tot=.35*ts+.25*cs+.2*ps+.1*ks+.1*vs;

function render(search){
var f={q:document.getElementById("q").value,c:document.getElementById("fc").value,b:document.getElementById("fb").value,k:document.getElementById("fk").value,v:document.getElementById("fv").value};
var idf=idfMap(),rs;

else{LF=null;rs=L.map(function(i,ix){return {i:i,ix:ix,s:null}}).filter(function(r){return !r.i.sold}).sort(function(a,b){return (a.i.sold?1:0)-(b.i.sold?1:0)||a.i.a-b.i.a})}

function act(i){if(i.sold)return '<button class="btn" disabled>Sold</button><p class="note">This item has been sold.</p>';

d.innerHTML='<div class="dp'+(i.sold?" sold":"")+'">'+pic(i)+(i.sold?'<span class="soldtag">Sold</span>':"")+'<button class="dx" id="dxb" aria-label="Close">&times;</button></div><div class="db"><div class="cp">'+price(i)+'</div><h2>'+esc(i.n)+'</h2><div class="cs">'+seller(i)+'</div><ul class="det"><li><span>Posted</span>'+ago(i.a)+'</li><li><span>Village</span>'+esc(i.v)+'</li><li><span>Condition</span>'+esc(i.k)+'</li><li><span>Category</span>'+esc(i.c)+'</li></ul><p>'+esc(i.d)+'</p>'+m+act(i)+'</div>';

if(sb)sb.onclick=function(){if(!sb.dataset.ok){sb.dataset.ok=1;sb.textContent="Confirm: item is sold";document.getElementById("sn").textContent="This removes the item from the listings.";return}L[ix].sold=true;d.close();render(!!LF);mine()}}

var KW={"Fans and appliances":"fan kettle cooker heater iron lamp appliance blender","Books and notes":"book textbook notes paper reference novel","Stationery":"pen pencil calculator highlighter ruler stapler","Kitchenware":"rice pot pan plate cup bowl spoon cooker steamer kitchen","Clothes":"shirt dress baju kurung jacket pants clothes","Bedding and storage":"bed sheet pillow blanket box storage mattress"};
function suggest(){
var t=tok(document.getElementById("pn").value+" "+document.getElementById("pd").value),best="",bs=0;

var k=document.getElementById("pk").value,F={New:1.3,Good:1,Used:.7},idf=idfMap(),q=vec(t,idf),
pool=L.filter(function(i){return i.c===best}).map(function(i){return {i:i,s:cos(q,vec(tok(txt(i)),idf))}}).sort(function(a,b){return b.s-a.s}).slice(0,3),
